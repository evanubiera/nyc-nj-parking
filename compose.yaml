# Local development database (ADR-0003). Host port 5434, so it doesn't clash with other projects' PostgreSQL.
# DATABASE_URL=postgres://parking:parking@localhost:5434/parking
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
